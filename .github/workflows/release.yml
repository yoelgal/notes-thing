name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # Xcode 26's SDK: apps linked against an older one get the legacy window look on macOS 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The self-signed "Notes Thing Signing" certificate (see scripts/build.sh), in a throwaway keychain.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/build.sh
      # Sparkle reads releases/latest/download/appcast.xml. The release stays a draft until the
      # appcast is attached, so "latest" never lacks one.
      - name: Publish release and appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TAG="$GITHUB_REF_NAME"; VERSION="${TAG#v}"
          gh release create "$TAG" dist/NotesThing.zip --generate-notes --draft
          NOTES=$(gh release view "$TAG" --json body -q .body)
          SIG=$(echo "$SPARKLE_PRIVATE_KEY" | app/.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - dist/NotesThing.zip)
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel><title>Notes Thing</title>
          <item>
            <title>$VERSION</title>
            <pubDate>$(date -R)</pubDate>
            <sparkle:version>$VERSION</sparkle:version>
            <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
            <description sparkle:format="markdown"><![CDATA[$NOTES]]></description>
            <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/NotesThing.zip" type="application/octet-stream" $SIG/>
          </item>
          </channel></rss>
          XML
          gh release upload "$TAG" appcast.xml
          gh release edit "$TAG" --draft=false --latest
