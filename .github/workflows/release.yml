name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/build.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/NotesThing.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
